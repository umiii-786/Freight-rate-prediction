stages:
  data_ingestion:
    cmd: python -m src.data.data_ingestion
    deps:
    - data/external
    - src/config.py
    - src/data/data_ingestion.py
    - src/utils.py
    params:
    - data_ingestion
    outs:
    - data/raw

  data_preprocessing:
    cmd: python -m src.data.data_preprocessing
    deps:
    - data/raw
    - src/data/data_preprocessing.py
    outs:
    - data/interim
  build_features:
    cmd: python -m src.features.build_features
    deps:
    - data/interim
    - src/features/build_features.py
    - src/features/preprocessing.py
    params:
    - features
    outs:
    - data/processed
  evaluate_models:
    cmd: python -m src.model.evaluate_models
    deps:
    - data/processed/train_test.csv
    - src/features/custom_transformers.py
    - src/features/preprocessing.py
    - src/model/cross_validation.py
    - src/model/evaluate_models.py
    - src/model/model_factory.py
    - src/tracking.py
    params:
    - base
    - cross_validation
    - features
    - models
    - train.model_name
    outs:
    - reports/cv_fold_results.csv
    - reports/figures/model_comparison.png
    - reports/model_comparison.csv
    metrics:
    - reports/metrics.json:
        cache: false
  train_model:
    cmd: python -m src.model.train_model
    deps:
    - data/processed/train_test.csv
    - src/features/custom_transformers.py
    - src/features/preprocessing.py
    - src/model/model_factory.py
    - src/model/train_model.py
    - src/tracking.py
    params:
    - base
    - cross_validation.log_target
    - features
    - models
    - train
    outs:
    - models/model.pkl
    - reports/train_run_info.json
