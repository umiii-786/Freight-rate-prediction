stages:
  data_ingestion:
    cmd: python -m src.data.data_ingestion
    deps:
    - data/external
    - src/config.py
    - src/data/data_ingestion.py
    - src/utils.py
    params:
    - data_ingestion
    outs:
    - data/raw

  data_preprocessing:
    cmd: python -m src.data.data_preprocessing
    deps:
    - data/raw
    - src/data/data_preprocessing.py
    outs:
    - data/interim
  build_features:
    cmd: python -m src.features.build_features
    deps:
    - data/interim
    - src/features/build_features.py
    - src/features/preprocessing.py
    params:
    - features
    outs:
    - data/processed
